name: secret-scan
# Pre-public guard: block credentials from entering (or already sitting in)
# git history before this repo is pushed public. .gitignore stops new secret
# FILES; this catches a secret pasted inline into a tracked file or committed
# in an earlier commit. Hardening matches the rest of the repo:
# - gitleaks CLI (MIT, free everywhere — the marketplace action demands a
#   GITLEAKS_LICENSE under a GitHub org; the CLI has no such trap).
# - Pinned by version AND sha256, same posture as pip --require-hashes.
# - checkout pinned by full commit SHA, fetch-depth 0 to scan ALL history.
# - --redact so a detected secret is never printed into the run log.

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0            # full history: scan every commit, not just HEAD
          persist-credentials: false

      - name: Install gitleaks (version- and hash-pinned)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL --retry 3 -o "$tarball" "$url"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          # Non-zero exit on any finding fails the job. --redact keeps secret
          # values out of the log even when it flags one.
          ./gitleaks detect --source . --redact --verbose --exit-code 1
